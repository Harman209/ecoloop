<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroLoopGrad" x1="150" y1="100" x2="750" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F6B4F"/>
      <stop offset="50%" stop-color="#5D8A72"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAF8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#171A18" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="700" rx="24" fill="#F7F7F3"/>

  <!-- Subtle Ambient Circles -->
  <circle cx="450" cy="350" r="280" stroke="#E2E8E0" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="450" cy="350" r="210" stroke="url(#heroLoopGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.6"/>

  <!-- Directional Connecting Curved Arrows -->
  <path d="M 450 140 C 650 140, 720 220, 720 350" stroke="#1F6B4F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <polygon points="720,360 714,346 726,346" fill="#1F6B4F"/>

  <path d="M 720 350 C 720 480, 650 560, 450 560" stroke="#5D8A72" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <polygon points="440,560 454,554 454,566" fill="#5D8A72"/>

  <path d="M 450 560 C 250 560, 180 480, 180 350" stroke="#E65100" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <polygon points="180,340 186,354 174,354" fill="#E65100"/>

  <path d="M 180 350 C 180 220, 250 140, 450 140" stroke="#1F6B4F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <polygon points="460,140 446,146 446,134" fill="#1F6B4F"/>

  <!-- ================= CENTER HUB (Clean Circular Branding, No Infinity Sign) ================= -->
  <g transform="translate(450, 350)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="95" fill="#FFFFFF" stroke="#1F6B4F" stroke-width="3"/>
    
    <!-- Subtle Inner Ring -->
    <circle cx="0" cy="0" r="82" stroke="#E2E8E0" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Brand Label Typography (Centered & Clean) -->
    <text x="0" y="-18" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" fill="#171A18" letter-spacing="1.5">ECO<tspan fill="#1F6B4F">LOOP</tspan></text>
    
    <!-- Accent Line -->
    <line x1="-35" y1="-5" x2="35" y2="-5" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
    
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#1F6B4F" letter-spacing="2">FROM WASTE TO WORTH</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#5D8A72" letter-spacing="1">CIRCULAR ZERO-WASTE</text>
  </g>

  <!-- ================= 6 CLEAR, SPACIOUS NODES ================= -->

  <!-- NODE 1: TOP (12 O'Clock) - SCHOOL WASTE -->
  <g transform="translate(330, 48)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#171A18" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#171A18"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">1</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">SCHOOL WASTE</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Paper, Organics, Uniforms</text>
  </g>

  <!-- NODE 2: TOP RIGHT (2 O'Clock) - TRANSFORMATION -->
  <g transform="translate(620, 190)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#1F6B4F" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#1F6B4F"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">2</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">STUDENT PROCESSING</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Pulping, Bio-Enzymes, Beds</text>
  </g>

  <!-- NODE 3: BOTTOM RIGHT (4 O'Clock) - VALUE-ADDED GOODS -->
  <g transform="translate(620, 430)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#1F6B4F" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#1F6B4F"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">3</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">PRODUCT CREATION</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Seed Paper, Bags, Compost</text>
  </g>

  <!-- NODE 4: BOTTOM (6 O'Clock) - SCHOOL & COMMUNITY -->
  <g transform="translate(330, 578)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#5D8A72" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#5D8A72"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">4</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">CAMPUS &amp; MARKET USE</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Internal Supply + Community</text>
  </g>

  <!-- NODE 5: BOTTOM LEFT (8 O'Clock) - ETHICAL REVENUE -->
  <g transform="translate(40, 430)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#E65100" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#E65100"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">5</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">ETHICAL REVENUE</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Self-Sustaining Marketplace</text>
  </g>

  <!-- NODE 6: TOP LEFT (10 O'Clock) - GREEN REINVESTMENT -->
  <g transform="translate(40, 190)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#1F6B4F" stroke-width="2"/>
    <circle cx="36" cy="37" r="18" fill="#1F6B4F"/>
    <text x="36" y="43" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">6</text>
    <text x="68" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#171A18">GREEN REINVESTMENT</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#5D8A72">Better Tools &amp; Equipment ↺</text>
  </g>

</svg>
