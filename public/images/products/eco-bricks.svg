<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#F4F6F3"/>
  <circle cx="300" cy="210" r="140" fill="#F5EFE6"/>
  
  <!-- Eco-Brick Illustration -->
  <g transform="translate(180, 110)">
    <!-- 2 Interlocking Eco-Bricks (Dense Plastic Bottles) -->
    <!-- Bottle 1 Horizontal -->
    <rect x="30" y="80" width="160" height="60" rx="14" fill="#FFFFFF" stroke="#1F6B4F" stroke-width="3"/>
    <rect x="190" y="95" width="20" height="30" rx="4" fill="#5D8A72"/>
    <rect x="210" y="98" width="10" height="24" rx="2" fill="#E65100"/>
    
    <!-- Dense Multicolored Clean Plastic Fill -->
    <rect x="40" y="90" width="25" height="40" rx="4" fill="#E67E22" fill-opacity="0.8"/>
    <rect x="70" y="90" width="30" height="40" rx="4" fill="#3498DB" fill-opacity="0.8"/>
    <rect x="105" y="90" width="25" height="40" rx="4" fill="#2ECC71" fill-opacity="0.8"/>
    <rect x="135" y="90" width="45" height="40" rx="4" fill="#F1C40F" fill-opacity="0.8"/>
    
    <!-- Bottle 2 Stacked -->
    <rect x="50" y="20" width="160" height="60" rx="14" fill="#FFFFFF" stroke="#5D8A72" stroke-width="3"/>
    <rect x="210" y="35" width="20" height="30" rx="4" fill="#1F6B4F"/>
    <rect x="230" y="38" width="10" height="24" rx="2" fill="#E65100"/>
    <rect x="60" y="30" width="35" height="40" rx="4" fill="#E74C3C" fill-opacity="0.8"/>
    <rect x="100" y="30" width="35" height="40" rx="4" fill="#9B59B6" fill-opacity="0.8"/>
    <rect x="140" y="30" width="60" height="40" rx="4" fill="#1ABC9C" fill-opacity="0.8"/>
  </g>
  
  <rect x="120" y="380" width="360" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8E0"/>
  <circle cx="145" cy="401" r="5" fill="#1F6B4F"/>
  <text x="160" y="406" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#171A18">Eco-Bricks • Packed Clean Plastic Material</text>
</svg>
