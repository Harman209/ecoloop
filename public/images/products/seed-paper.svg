<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#F4F6F3"/>
  <circle cx="300" cy="210" r="140" fill="#E8EFEA"/>
  
  <!-- Seed Paper Illustration -->
  <g transform="translate(180, 100)">
    <!-- Stack of textured seed paper sheets -->
    <rect x="30" y="30" width="180" height="230" rx="8" fill="#E6DFD5" transform="rotate(6 120 145)" stroke="#D4C9BD" stroke-width="2"/>
    <rect x="20" y="15" width="180" height="230" rx="8" fill="#ECE6DC" transform="rotate(-3 110 130)" stroke="#DBD2C5" stroke-width="2"/>
    <rect x="30" y="20" width="180" height="230" rx="8" fill="#FAF6EE" stroke="#DDD4C7" stroke-width="2"/>
    
    <!-- Embedded Seeds Textures -->
    <circle cx="65" cy="55" r="3" fill="#657953"/>
    <circle cx="145" cy="70" r="2.5" fill="#4B6040"/>
    <circle cx="95" cy="110" r="3" fill="#5F734E"/>
    <circle cx="170" cy="130" r="2" fill="#758863"/>
    <circle cx="60" cy="170" r="3.5" fill="#4B6040"/>
    <circle cx="130" cy="190" r="2.5" fill="#657953"/>
    <circle cx="160" cy="215" r="3" fill="#506645"/>
    
    <!-- Sprouting Green Leaf -->
    <path d="M120 120 Q110 70 160 50 Q160 100 120 120 Z" fill="#1F6B4F"/>
    <path d="M120 120 Q140 90 190 85 Q165 125 120 120 Z" fill="#5D8A72"/>
    <path d="M120 120 L120 150" stroke="#1F6B4F" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Info Badge -->
  <rect x="140" y="380" width="320" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8E0"/>
  <circle cx="165" cy="401" r="5" fill="#1F6B4F"/>
  <text x="180" y="406" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#171A18">Seed Paper • Recovered Paper + Seeds</text>
</svg>
