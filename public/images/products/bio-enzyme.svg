<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#F4F6F3"/>
  <circle cx="300" cy="210" r="140" fill="#EBF4EE"/>
  
  <!-- Bio-Enzyme Bottle Illustration -->
  <g transform="translate(220, 80)">
    <!-- Glass Bottle Body with Amber/Citrus liquid -->
    <rect x="40" y="80" width="80" height="170" rx="16" fill="#FBF8EE" stroke="#1F6B4F" stroke-width="3"/>
    <!-- Liquid Level -->
    <rect x="43" y="140" width="74" height="106" rx="12" fill="#FCEAC7" fill-opacity="0.9"/>
    <!-- Fermentation Bubbles -->
    <circle cx="65" cy="180" r="4" fill="#E67E22" fill-opacity="0.5"/>
    <circle cx="95" cy="195" r="5" fill="#E67E22" fill-opacity="0.4"/>
    <circle cx="75" cy="215" r="3" fill="#E67E22" fill-opacity="0.6"/>
    <circle cx="88" cy="160" r="3.5" fill="#E67E22" fill-opacity="0.5"/>
    
    <!-- Bottle Neck and Cap -->
    <rect x="65" y="35" width="30" height="45" rx="3" fill="#FAF6EE" stroke="#1F6B4F" stroke-width="3"/>
    <rect x="60" y="20" width="40" height="16" rx="4" fill="#1F6B4F"/>
    
    <!-- Citrus Peel Accent -->
    <path d="M125 190 C150 170, 160 210, 130 230 C110 240, 100 210, 125 190 Z" fill="#FFA94D"/>
    <path d="M130 195 C145 180, 150 205, 132 218 Z" fill="#FFE066"/>
    
    <!-- Eco Label on Bottle -->
    <rect x="52" y="145" width="56" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8E0"/>
    <text x="80" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#1F6B4F">BIO</text>
    <text x="80" y="182" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7" fill="#5D8A72">ENZYME</text>
    <circle cx="80" cy="194" r="3" fill="#1F6B4F"/>
  </g>
  
  <rect x="130" y="380" width="340" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8E0"/>
  <circle cx="155" cy="401" r="5" fill="#1F6B4F"/>
  <text x="170" y="406" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#171A18">Bio-Enzyme • Fermented Citrus Peels</text>
</svg>
